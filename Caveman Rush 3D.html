(async()=>{try{if(!window.claude)return;const u=await claude.use('user'),d=await claude.use('db');if(!u||!d)return;const id=await u.id();if(!id)return;

 const gv=k=>k==='ft'?1+Math.floor(rnd(0,2)):Math.round(rnd(10,30)),KS=['fr','rg','ft'];

}

 document.getElementById('wt').textContent=w?'VICTORY!':'DEFEATED';document.getElementById('wr').innerHTML='🪙 '+reward+(S.bonus?'<div style="font-size:13px;color:#e0a020">⭐ WALL CLEARED BONUS +'+S.bonus+'</div>':'');

let AC=null;

function update(dt){
 if(mode!=='play')return;
 px+=(tx-px)*Math.min(1,dt*12);S.cmbT=Math.max(0,(S.cmbT||0)-dt);S.rage=Math.max(0,(S.rage||0)-dt);S.inv=Math.max(0,(S.inv||0)-dt);
 let blocked=false;for(const o of S.obs)if(o.t==='b'&&!o.dead&&Math.abs(o.x-px)<.34&&o.z-S.z<12&&o.z-S.z>-6){blocked=true;break}

 for(const o of S.obs){const dz=o.z*Z-wz;if(dz>150||dz<-8){const g=mp.get(o);if(g)g.visible=false;continue}

 const hs=mode==='play'?'<span>👥 '+S.fighters+'</span><span>🔥 '+S.fr+'</span><span>🎯 '+S.rg+'</span>'+(S.rage>0?'<span>⚡ '+Math.ceil(S.rage)+'s</span>':'')+(S.shield?'<span>🛡</span>':'')+(S.cmbT>0&&S.combo>=3?'<span>🔥 x'+Math.min(5,1+Math.floor(S.combo/3))+'</span>':'')+(S.z>S.LEN-150?'<span>🧱 '+S.obs.filter(o=>o.t==='b').length+'</span>':''):'';if(hs!==sync.h){sync.h=hs;document.getElementById('hs').innerHTML=hs}}
