
name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Create Android project
        run: |
          mkdir -p www
          cp caveman-rush-3d.html www/index.html
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor-community/admob@6 three@0.128.0
          cp node_modules/three/build/three.min.js www/three.min.js
          sed -i 's#https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js#three.min.js#' www/index.html
          npx cap init "Caveman Rush" com.yourname.cavemanrush --web-dir=www
          npx cap add android
          node <<'JS'
          const fs=require('fs');const APP_ID='ca-app-pub-9232501937383801~1509621156';
          const mp='android/app/src/main/AndroidManifest.xml',sp='android/app/src/main/res/values/strings.xml';
          let m=fs.readFileSync(mp,'utf8');
          if(!m.includes('APPLICATION_ID'))m=m.replace('</application>','<meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="@string/admob_app_id"/></application>');
          if(!m.includes('screenOrientation'))m=m.replace('<activity','<activity android:screenOrientation="portrait"');
          fs.writeFileSync(mp,m);
          let s=fs.readFileSync(sp,'utf8');
          if(!s.includes('admob_app_id'))s=s.replace('</resources>','<string name="admob_app_id">'+APP_ID+'</string></resources>');
          fs.writeFileSync(sp,s);
          JS
          npx cap sync android
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: caveman-rush-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
