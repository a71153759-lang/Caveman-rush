const ref=d.collection('data/users/'+id).doc('save'),sn=await ref.get();

}

function end(w){won=w;mode=w?'win':'lose';reward=Math.floor(S.coins*(1+.25*save.inc))+10*save.lvl;S.bonus=0;if(w&&S.perfect){S.bonus=Math.floor(reward*.5)+50*save.lvl;reward+=S.bonus}if(!w)reward=Math.floor(reward/2);
 document.getElementById('wt').textContent=w?'VICTORY!':'DEFEATED';document.getElementById('wr').innerHTML='🪙 '+reward+(S.bonus?'<div style="font-size:13px;color:#e0a020">⭐ WALL CLEARED BONUS +'+S.bonus+'</div>':'');

function update(dt){
 if(mode!=='play')return;
 px+=(tx-px)*Math.min(1,dt*12);
 let blocked=false;for(const o of S.obs)if(o.t==='b'&&!o.dead&&Math.abs(o.x-px)<.34&&o.z-S.z<12&&o.z-S.z>-6){blocked=true;break}
 if(!blocked){S.v=Math.min(95,(S.v||0)+220*dt);S.z+=S.v*dt}else S.v=0;
 if(S.z>S.LEN-60)S.wall+=dt;
 S.cd-=dt;
 if(S.cd<=0){S.cd=1/(S.fr/50);const dmg=1+save.up*.5;for(let i=0;i<S.fighters;i++)S.bul.push({x:px+((i%3)-(Math.min(S.fighters,3)-1)/2)*1.1/4,z:S.z+8,d:0,dmg})}
 const range=120+S.rg*1.2;
 for(const b of S.bul){b.z+=420*dt;b.d+=420*dt;if(b.d>range)b.dead=1;
  for(const o of S.obs){if(o.dead||b.dead)continue;const dz=Math.abs(o.z-b.z),dx=Math.abs(o.x-b.x);
   if(o.t==='g'&&dz<10&&dx<.3){o.v++;b.dead=1}
   else if(o.t==='p'&&o.hp>0&&dz<10&&dx<.2){o.hp-=b.dmg;b.dead=1}
   else if(o.t==='e'&&dz<10&&dx<.15){o.hp-=b.dmg;b.dead=1;if(o.hp<=0){o.dead=1;S.coins+=3}}
   else if(o.t==='b'&&dz<10&&dx<.2){o.hp-=b.dmg;S.coins+=b.dmg;b.dead=1;if(o.hp<=0){o.dead=1;S.coins+=5}}}}
 S.bul=S.bul.filter(b=>!b.dead);
 for(const o of S.obs){if(o.dead)continue;
  if(o.t==='e'){0}
  const dz=o.z-S.z,hit=Math.abs(o.x-px)<.3;
  if(o.t==='g'&&dz<6&&dz>-6&&hit){if(o.k==='fr')S.fr+=o.v;else S.rg+=o.v;o.dead=1}
  if(o.t==='p'&&o.hp<=0&&dz<6&&hit){S.fighters=Math.min(capMax(),S.fighters+1);o.dead=1}
  if(o.t==='e'&&dz<6){o.dead=1;if(Math.abs(o.x-px)<.4){S.fighters--;S.shake=.6;if(S.fighters<=0)return end(false)}}}
 S.obs=S.obs.filter(o=>!o.dead&&(o.t==='b'||o.z>S.z-30));
 if(!S.obs.some(o=>o.t==='b')){S.perfect=1;return end(true)}
 if(S.wall>12||S.z>S.LEN+110)end(true)}

 else if(hat==='h3'){add(new THREE.CylinderGeometry(.34,.4,.2,10),0xf2c230,0,2.38,0);for(let i=0;i<5;i++){const a=i/5*6.283;add(new THREE.ConeGeometry(.08,.22,5),0xf2c230,Math.sin(a)*.36,2.58,Math.cos(a)*.36)}}
 g.userData.legs=[-1,1].map(q=>{const p=new THREE.Group();p.position.set(q*.19,.5,0);add(new THREE.CylinderGeometry(.14,.12,.5,8),sk,0,-.25,0,p);add(new THREE.BoxGeometry(.24,.12,.34),0x5a3a1c,0,-.5,.06,p);g.add(p);return p});
 g.userData.arms=[-1,1].map(q=>{const p=new THREE.Group();p.position.set(q*.52,1.4,0);add(new THREE.CylinderGeometry(.11,.09,.55,8),sk,0,-.27,0,p);add(new THREE.SphereGeometry(.12,8,6),sk,0,-.58,0,p);if(rock&&q>0)add(new THREE.SphereGeometry(.16,8,6),rock,0,-.7,.05,p);g.add(p);return p});return g}

 if(o.t==='g'){const c=o.k==='fr'?0x35c957:0x3a9ae0;const p=new THREE.Mesh(new THREE.BoxGeometry(2.6,2.2,.3),M(c));p.position.y=2.1;g.add(p);
  [-1,1].forEach(s=>{const q=new THREE.Mesh(new THREE.BoxGeometry(.3,3.2,.4),M(0xf08a24));q.position.set(s*1.4,1.6,0);g.add(q)});

 sc.add(g);mp.set(o,g);return g}
function sync(){
 const wz=S.z*Z,run=mode==='play'&&(S.v||0)>5;
 const sh=S.shake||0;S.shake=Math.max(0,sh-DT*2.5);cam.position.set(-px*X*.5+(Math.random()-.5)*sh,9.5+(Math.random()-.5)*sh*.6,wz-12);cam.lookAt(-px*X*.35,.5,wz+13);
 for(let i=0;i<180;i++){sp[i*3+1]-=DT*1.6;sp[i*3]+=DT*.4;if(sp[i*3+1]<0){sp[i*3+1]=16;sp[i*3]=rnd(-20,20)}}snow.geometry.attributes.position.needsUpdate=true;snow.position.z=wz;lane.position.z=wz+110;lt.offset.y=-(wz+110)/7.2;rails.forEach(r=>r.position.z=wz+110);gnd.position.z=wz+100;fin.position.z=(S.LEN-25)*Z;
 const n=S.fighters;while(squad.length<n){const m=hero();sc.add(m);squad.push(m)}
 squad.forEach((m,i)=>{m.visible=i<n;if(i<n){const gx=-(px*X+((i%3)-(Math.min(n,3)-1)/2)*1.1),gz=wz-Math.floor(i/3)*1.1-(i%3===1?.0:.35);if(!m.userData.i){m.position.x=gx;m.position.z=gz;m.userData.i=1}const k=Math.min(1,DT*14);m.position.x+=(gx-m.position.x)*k;m.position.z+=(gz-m.position.z)*k;anim(m,run,i)}else m.userData.i=0});
 const live=new Set(S.obs);for(const[o,g]of mp)if(!live.has(o)){sc.remove(g);mp.delete(o)}
 for(const o of S.obs){const dz=o.z*Z-wz;if(dz>150||dz<-8){const g=mp.get(o);if(g)g.visible=false;continue}
  const g=mp.get(o)||build(o);g.visible=true;g.position.set(-o.x*X,0,o.z*Z);const u=g.userData;
  if(o.t==='g'){setNum(u.n,'+'+o.v);if(u.pv!==o.v){u.pv=o.v;u.pl=1}u.pl=Math.max(0,(u.pl||0)-DT*6);g.scale.setScalar(1+u.pl*.12)}else if(o.t==='p'){setNum(u.n,o.hp>0?Math.ceil(o.hp):'');u.d.visible=o.hp>0;anim(u.m,o.hp<=0,0)}
  else if(o.t==='e'){setNum(u.n,Math.ceil(o.hp));anim(u.m,false,0);u.m.rotation.y=Math.PI}else{const h=Math.ceil(o.hp);setNum(u.n,h);if(u.pv!==h){u.pv=h;u.pl=1}u.pl=Math.max(0,(u.pl||0)-DT*6);g.scale.set(1+u.pl*.08,1,1+u.pl*.08)}}
 while(bm.length<S.bul.length){const b=new THREE.Mesh(new THREE.SphereGeometry(.22,8,6),M(RK[save.eq.rock].c));sc.add(b);bm.push(b)}
 bm.forEach((b,i)=>{const bl=S.bul[i];b.visible=!!bl;if(bl)b.position.set(-bl.x*X,1.3,bl.z*Z)});
 document.getElementById('hc').textContent='🪙 '+(save.coins+(mode==='play'?S.coins:0));document.getElementById('hl').textContent='LEVEL '+save.lvl;
 const hs=mode==='play'?'<span>👥 '+S.fighters+'</span><span>🔥 '+S.fr+'</span><span>🎯 '+S.rg+'</span>'+(S.z>S.LEN-150?'<span>🧱 '+S.obs.filter(o=>o.t==='b').length+'</span>':''):'';if(hs!==sync.h){sync.h=hs;document.getElementById('hs').innerHTML=hs}}
function move(e){const r=cv.getBoundingClientRect();tx=Math.max(-.85,Math.min(.85,((e.clientX-r.left)/r.width*2-1)*1.1))}
cv.addEventListener('pointerdown',move);cv.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch')move(e)});
addEventListener('keydown',e=>{if(e.key==='ArrowLeft')tx=Math.max(-.85,tx-.15);if(e.key==='ArrowRight')tx=Math.min(.85,tx+.15)});

let tab='skins';const TB={skins:['skin',SK],hats:['hat',HT],rocks:['rock',RK]},hx=n=>'#'+n.toString(16).padStart(6,'0');

 document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));

  const ic=slot==='skin'?`<i class="dot" style="background:${hx(it.shirt)};box-shadow:inset 0 0 0 6px ${hx(it.hair)}"></i>`:slot==='rock'?`<i class="dot" style="background:${hx(it.c)}"></i>`:`<i class="dot" style="background:none;font-style:normal;font-size:26px;line-height:34px;text-align:center">${{h0:'🚫',h1:'🦴',h2:'🪖',h3:'👑'}[id]}</i>`;
  return `<button class="item ${eq?'eq':''}" data-id="${id}">${ic}<b>${it.n}</b><em>${eq?'Equipped':own?'Equip':'🪙 '+it.p}</em></button>`}).join('')}

 if(!save.own.includes(id)){if(save.coins<it.p){b.classList.add('no');setTimeout(()=>b.classList.remove('no'),300);return}save.coins-=it.p;save.own.push(id)}
 save.eq[slot]=id;persist();rebuildLook();renderShop();renderHome()};
